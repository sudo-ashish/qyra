# Qyra hyprlock configuration
# Dynamic theme colors sourced from Tier 3
source = ~/.config/themes/current/generated/hyprlock-color.conf

background {
    monitor =
    path = ~/.config/themes/current/background
    blur_passes = 2
    contrast = 1.0
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

general {
    hide_cursor = true
    ignore_empty_input = true
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 2
    dots_size = 0.35
    dots_spacing = 0.3
    dots_center = true
    outer_color = $border
    inner_color = $background
    font_color = $foreground
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = true
    rounding = 10
    check_color = $accent
    fail_color = $red
    fail_text = <i>Authentication Failed</i>
    placeholder_text = <span>Enter password...</span>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $foreground
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = $muted
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 10
    halign = center
    valign = center
}
